name: CI

# Drift guard: each rule lives in rule/ and is embedded into the generated
# transport copies (src/ + remote/lib/) by scripts/embed.mjs.
# `npm test` runs check-sync (fails if a copy is stale, i.e. someone edited
# a rule without re-running `npm run embed`) and check-always-on (fails if the
# hand-condensed paste block in ALWAYS-ON.md no longer matches the rule's size),
# then build + both stdio smokes and the validator fixtures. This makes silent
# rule-drift impossible to merge.
#
# `npm run smoke:remote` is deliberately NOT run here: it is the only script that
# makes a network call, and it targets the deployed host, which does not exist
# yet at PR time. Run it against the production URL after the merge deploys.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
